# Private test deployment on one Docker host (AWS Lightsail): the app image
# from the repository's Dockerfile behind Caddy, which serves HTTPS with an
# automatic Let's Encrypt certificate. See docs/LIGHTSAIL_TEST_RUNBOOK.md.
#
# Run through deploy/lightsail/ctl.sh, which passes --env-file
# <root>/compose.env (APPLY101_DOMAIN, APPLY101_ROOT, ports).
name: apply101

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: apply101-test:local
    restart: unless-stopped
    # Secrets (JWT_SECRET_KEY, APPLY101_ACCESS_KEY) and sync settings; the
    # file lives on the server only, created by ctl.sh setup.
    env_file: ${APPLY101_ROOT:?}/app.env
    environment:
      # Fixed here so app.env cannot move the data off the host directory.
      APPLY101_DATA_DIR: /data
      APPLY101_DATABASE_URL: sqlite:////data/apply101-test.db
      APPLY101_UPLOAD_DIR: /data/uploads
    volumes:
      - ${APPLY101_ROOT:?}/data:/data
    # Only Caddy's fixed address may set X-Forwarded-For, so the app's rate
    # limits see each client's own address. Caddy ignores the header from
    # clients (no trusted_proxies), so it cannot be spoofed.
    command:
      - sh
      - -c
      - exec uvicorn --factory backend.app.deploy_app:create_app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips 172.30.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      internal:
        ipv4_address: 172.30.0.20
    # No ports: the app is reachable only through Caddy.

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APPLY101_HTTP_PORT:-80}:80"
      - "${APPLY101_HTTPS_PORT:-443}:443"
    environment:
      APPLY101_DOMAIN: ${APPLY101_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPLY101_ROOT:?}/caddy/data:/data
      - ${APPLY101_ROOT:?}/caddy/config:/config
    networks:
      internal:
        ipv4_address: 172.30.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24
